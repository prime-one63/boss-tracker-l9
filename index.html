<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Tracker Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <!-- 🔹 Browser Tab Icon -->
  <link rel="icon" type="image/png" href="img/Aztecz-transpa.png">
</head>
<body>
  <!-- Top Navigation Bar -->
  <div class="topnav">
    <div class="logo-container">
      <img src="img/Aztecz-transpa.png" class="logo" alt="Logo">
      <span class="brand">LordNine Boss Tracker</span>
    </div>

    <button class="nav-toggle" aria-label="Toggle navigation">
      ☰
    </button>

    <!-- <button id="btnTimezone" class="btn btn-sm btn-dark" style="margin-bottom:10px;">
      🌍 Timezone: UTC+8
    </button> -->

    <select id="timezoneSelect" class="form-select form-select-sm mb-3" style="width: 150px;">
      <option value="8" selected>UTC+8</option>
      <option value="7">UTC+7</option>
      <option value="4">UTC+4</option>
    </select>

    <label class="notif-toggle" title="Browser notification 10 min before spawn">
      <input type="checkbox" id="notifToggle">
      <span class="notif-slider">🔔</span>
    </label>

    <ul class="nav-links">
      <li><a id="navDashboard" href="#" class="active">Dashboard</a></li>
      <li><a id="navBossList" href="#">Boss List</a></li>
      <!-- Add more links if needed -->
    </ul>
  </div>

  <main>
    <div id="dashboardSection">
      <h3 class="mb-4">Boss Spawn Dashboard</h3>
      <div id="dashboardCards" class="row g-3 justify-content-center"></div>
    </div>

    <div id="bossListContainer"><!-- tracker list will be loaded here --></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/dashboard.min.js"></script>
</body>
</html>
