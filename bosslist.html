<div id="bossListSection">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Boss List Tracker</h3>
    <div class="d-flex gap-2">
      <button id="btnRepopulate" class="btn btn-success btn-sm">
        ♻ Repopulate Schedule
      </button>
      <button id="btnBulkImport" class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#bulkImportModal">
        📥 Bulk Import
      </button>
      <button id="btnDeleteAll" class="btn btn-danger btn-sm">
        🗑 Delete All
      </button>
      <button id="btnAdd" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#bossModal">
        ➕ Add Boss
      </button>
    </div>
  </div>

  <!-- Bulk Import Modal -->
  <div class="modal fade" id="bulkImportModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="bulkImportForm">
          <div class="modal-header">
            <h5 class="modal-title">Bulk Import Boss Times</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Select Date for Import</label>
              <input type="date" class="form-control" id="bulkImportDate" value="">
            </div>
            <div class="mb-3">
              <label class="form-label">Paste boss times (format: • HH:MM — BossName)</label>
              <textarea class="form-control" id="bulkImportData" rows="12" placeholder="• 00:19 — Venatus — เวนาดัส
• 00:21 — Vioren — วีโอเลนท์
• 00:31 — Lady Dalia — เลดี้ดาเลีย"></textarea>
            </div>
            <small class="text-muted">Spawn intervals are auto-detected from multiple times per boss. Times are in military format (24h). Input in +7 timezone — automatically converted to +8 (+1 hour).</small>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-warning">Import</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="card p-3">
    <div class="table-responsive">
      <table id="bossGrid" class="tracker-grid">
        <thead class="table-primary">
          <tr>
            <th>Boss</th>
            <th>Guild</th>
            <th>Hour Spawn</th>
            <th>Last Killed</th>
            <th>Next Spawn</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bossTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal for Add/Edit -->
<div class="modal fade" id="bossModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="bossForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-header-text">Add Boss</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editKey" name="editKey"/>
          <div class="mb-3">
            <label class="form-label">Boss Name</label>
            <input type="text" class="form-control text-uppercase" id="bossName" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Estimated Time Death</label>
            <input type="number" min="1" step="1" class="form-control text-uppercase" value="1" id="estimatedDeath" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Boss Level</label>
            <input type="number" min="60" step="1" class="form-control text-uppercase" value="60" id="bossLevel" required />
          </div>
          <div class="mb-3">
            <label for="guild" class="form-label">Assigned Guild</label>
            <select id="guild" class="form-select">
              <option value="Faction" selected>Faction</option>
              <option value="AZTECzX1">AZTECzX1</option>
              <option value="AZTECzV2">AZTECzV2</option>
              <option value="AzteczX4龙牙">AzteczX4龙牙</option>
              <option value="クAzteczモ">クAzteczモ</option>
              <option value="ValhallasS">ValhallasS</option>
            </select>
          </div>
          <!-- Spawn Type -->
          <div class="mb-3" style="color:black;">
            <label class="form-label">Spawn Type</label><br>
            <input type="radio" name="spawnType" id="spawnHourType" checked> Hour Interval
            <input type="radio" name="spawnType" id="spawnScheduleType"> Scheduled Time
          </div>
          <div id="hourGroup" class="mb-3">
            <label class="form-label">Spawn Interval (Hours)</label>
            <input type="number" class="form-control" id="bossHour" min="1" />
          </div>
          <div class="mb-3" id="scheduleGroup" style="display: none;">
            <label for="bossSchedule" class="form-label">Date Schedule</label>
            <select id="bossSchedule" class="form-select">
              <option value="" selected></option>
              <option value="Monday 11:30">Monday 11:30</option>
              <option value="Monday 19:00">Monday 19:00</option>
              <option value="Monday 21:00">Monday 21:00</option>
              <option value="Tuesday 11:30">Tuesday 11:30</option>
              <option value="Tuesday 19:00">Tuesday 19:00</option>
              <option value="Tuesday 22:00">Tuesday 22:00</option>
              <option value="Wednesday 11:30">Wednesday 11:30</option>
              <option value="Wednesday 21:00">Wednesday 21:00</option>
              <option value="Thursday 11:30">Thursday 11:30</option>
              <option value="Thursday 19:00">Thursday 19:00</option>
              <option value="Friday 19:00">Friday 19:00</option>
              <option value="Friday 22:00">Friday 22:00</option>
              <option value="Saturday 15:00">Saturday 15:00</option>
              <option value="Saturday 17:00">Saturday 17:00</option>
              <option value="Saturday 21:00">Saturday 21:00</option>
              <option value="Saturday 22:00">Saturday 22:00</option>
              <option value="Sunday 17:00">Sunday 17:00</option>
              <option value="Sunday 19:00">Sunday 19:00</option>
              <option value="Sunday 21:00">Sunday 21:00</option>
            </select>
          </div>
          <div class="mb-3" id="lastKilledField">
            <label class="form-label">Last Killed</label>
            <input type="datetime-local" class="form-control" id="lastKilled" />
          </div>
          <div class="mb-3">
            <label class="form-label">Next Spawn (Auto)</label>
            <input type="datetime-local" class="form-control" id="nextSpawn" readonly />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
